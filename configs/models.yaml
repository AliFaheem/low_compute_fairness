    revision: 49e3418fbbbca6ecbdf9608b4d22e5a407081db4
    wanda50: {hf_id: models/qwen3-8b-wanda50, revision: null}   # pruned on the Vast machine, kept local (bandwidth)
    wanda25: {hf_id: models/qwen3-8b-wanda25, revision: null}
    awq: {hf_id: models/qwen3-8b-awq, revision: null}   # scripts/compression/awq_quant.py (mixed calibration)
    wanda50mix: {hf_id: models/qwen3-8b-wanda50mix, revision: null}

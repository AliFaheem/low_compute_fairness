# Models and how each variant is loaded. Revisions are pinned so every machine runs the same weights.
# Update a revision only on purpose: results from different revisions are not comparable.

variants:
  bf16: {}                       # native weights, the reference
  int8: {quantization: int8}     # bitsandbytes LLM.int8(), applied at load time
  nf4: {quantization: nf4}       # bitsandbytes 4-bit NormalFloat, applied at load time
  wanda50: {pruned: wanda50}     # Wanda 50% unstructured; loaded from the model's `wanda50` repo
  wanda25: {pruned: wanda25}     # Wanda 25% unstructured (light pruning)
  wanda50mix: {pruned: wanda50mix}   # Wanda 50%, calibration 1/3 C4 en + 1/3 FineWeb-2 Urdu + 1/3 Roman Urdu (ablation)
  wanda25mix: {pruned: wanda25mix}   # Wanda 25%, same mixed calibration (ablation)
  awq: {quantization: awq}       # AWQ 4-bit, group 128, mixed calibration; local copy from scripts/compression/awq_quant.py

models:
  # Exp 1: quantization and pruning
  llama-3.1-8b:
    hf_id: meta-llama/Llama-3.1-8B
    revision: d04e592bb4f6aa9cfee91e2e20afa771667e1d4b
    gated: true
    wanda50: {hf_id: models/llama-3.1-8b-wanda50, revision: null}   # pruned on the Vast machine, kept local
    wanda25: {hf_id: models/llama-3.1-8b-wanda25, revision: null}
    wanda50mix: {hf_id: models/llama-3.1-8b-wanda50mix, revision: null}
    wanda25mix: {hf_id: models/llama-3.1-8b-wanda25mix, revision: null}
    awq: {hf_id: models/llama-3.1-8b-awq, revision: null}   # scripts/compression/awq_quant.py (mixed calibration)
  qwen3-8b:

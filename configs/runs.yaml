# The experiment grid. One run = (model, variant, language) and writes results/runs/<model>__<variant>__<lang>/.

languages: [en, ur, roman_ur, ur_abc]   # ur_abc = Urdu prompt with Latin A/B/C labels (robustness / candidate main)

experiments:
  exp1:                          # quantization and pruning, each variant vs its own bf16
    models: [llama-3.1-8b, qwen3-8b, gemma-4-e4b, qalb-1.0-8b, alif-1.0-8b]   # qalb, alif: Urdu-adapted Llama-3.1-8B (side study)
    variants: [bf16, int8, nf4, wanda50, wanda25]
  exp1_calib:                    # Wanda calibration-language ablation: English C4 (exp1 wanda50) vs mixed en/ur/roman_ur
    models: [llama-3.1-8b, qwen3-8b, gemma-4-e4b, qalb-1.0-8b, alif-1.0-8b]
    variants: [wanda50mix, wanda25mix]
  exp2:                          # distillation: students vs llama-3.1-8b bf16 (shared with exp1)
    models: [llama-3.1-minitron-4b-width, llama-3.1-minitron-4b-depth, llama-3.2-3b]
    variants: [bf16]
  exp2_optional:                 # needs a >=40 GB GPU
    models: [mistral-nemo-12b, mistral-nemo-minitron-8b]
    variants: [bf16]

# Which machine runs which models: `run.py --machine <name>` runs every grid run of those models.
# Assigning whole models keeps each model's download on one machine. Two machines must never
# share a model. Fill in real machine names, e.g.:
#   lab-4090: [llama-3.1-8b, llama-3.1-minitron-4b-width]
machines: {}
